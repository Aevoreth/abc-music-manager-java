name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Parse version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ($tag -notmatch '^v(\d+(\.\d+){1,3})$') {
            throw "Tag must look like v0.3.2 (got: $tag)"
          }
          $ver = $Matches[1]
          Write-Host "version=$ver"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install WiX 3.11
        shell: pwsh
        run: |
          $wixDir = Join-Path $env:RUNNER_TEMP 'wix311'
          $zip = Join-Path $env:RUNNER_TEMP 'wix311-binaries.zip'
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $wixDir -Force
          Add-Content -Path $env:GITHUB_PATH -Value $wixDir
          & (Join-Path $wixDir 'candle.exe') -? | Select-Object -First 1

      - name: Build shaded JAR
        run: mvn -B -pl abcmm-app -am package -DskipTests

      - name: Package ZIP and MSI
        shell: pwsh
        run: |
          ./distribute/package-windows.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -Jar 'abcmm-app/target/abc-music-manager.jar'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            distribute/output/ABC-Music-Manager-${{ steps.version.outputs.version }}.zip
            distribute/output/ABC-Music-Manager-${{ steps.version.outputs.version }}.msi
